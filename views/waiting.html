<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCEND | Aguardando</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="waiting">
  <div class="screen active" id="screen-waiting">
    <div class="game-title">
      <h1>ASCEND</h1>
      <p>corrida vertical multijogador</p>
    </div>
    <div class="card">
      <span class="card-title">Partida em andamento</span>
      <div class="status-bar">
        <span class="status-dot"></span>
        <span id="waiting-status">aguardando fim da partida…</span>
      </div>
      <hr class="divider">
      <p class="waiting-msg">
        Uma partida está em andamento.<br>
        Você entrará no próximo lobby assim que ela terminar.
      </p>
    </div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
